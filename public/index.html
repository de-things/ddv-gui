<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" href="/">
        <link rel="stylesheet" href="/theme.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div id="response_indicator"></div>
        <div id="area_A" class="stretch" style="min-height: 50%; min-width: 50%; display: flex; flex-direction:column; gap: 1rem;">
            <div class="stretch" style="min-height: 0rem;">
                <div class="area" id="logs"></div>
                <div class="area" id="config_app" style="display: none;"></div>
                <div class="area" id="config_tile" style="display: none;"></div>
                <div class="area" id="presets" style="display: none;"></div>
            </div>
            <div id="area_A_navbar" style="min-width: 4rem; min-height: 4rem; display: flex; gap: 1rem">
                <div class="tile basic_item_icon tile_btn" id="config_app_nav_btn"></div>
                <div class="tile basic_item_icon tile_btn" id="presets_nav_btn"></div>
            </div>
            <div id="qr_gui" class="stretch" style="display: none;">
                <div id="qr_secret_layout" class="stretch">
                    <div id="qr_secret"></div>
                    <div id="qr_secret_text" style="user-select: text;"></div>
                </div>
                <div id="qr_gui_close_btn" class="tile basic_item_icon tile_btn"></div>
            </div>
        </div>
        <div id="area_B" class="stretch" style="min-height: 50%; min-width: 50%;">
            <div class="area" id="tiles"></div>
            <div class="area" id="config_preset" style="display: none;"></div>
        </div>
    </body>
    <script src="/bundle.min.js"></script>
</html>
